apply plugin: 'com.android.application'

android {
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        // 注意：改包名必须同步改三处硬编码（否则运行期才炸，很难查）
        //   1. AppUtils.INTERNAL_STORAGE   —— E: 盘的宿主路径
        //   2. AndroidManifest 的 FileProvider authorities
        //   3. FileUtils 里 getUriForFile 用的同一个 authority 字面量
        applicationId 'com.lilyco42.aicwinlator'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 33
        versionName "11.2"
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
}
